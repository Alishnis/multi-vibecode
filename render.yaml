# Render Blueprint: puts the shared contract server on the internet.
# In the Render dashboard choose New > Blueprint and pick this repository.
# Render then asks for OPENROUTER_API_KEY; paste your key there, not here.
#
# Free plan limits to know:
#   - the server sleeps when idle and takes up to a minute to wake up
#   - the database file is wiped on every restart or redeploy
services:
  - type: web
    name: team-contract
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional free Gemini key for small jobs (one-sentence edit summaries).
      - key: GEMINI_API_KEY
        sync: false
      # Optional server-wide password for approving decisions in any room.
      # Each room can also set its own team key on the dashboard instead.
      - key: CONTRACT_APPROVAL_TOKEN
        sync: false
